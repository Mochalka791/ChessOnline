<section class="game-panel">
  <div class="game-panel__header">
    <h2>Blockwood</h2>
    <p class="game-panel__status" id="blockwood-status">Puzzle bereit.</p>
  </div>
  <div class="game-panel__body">
    <div class="game-panel__metrics">
      <div><span class="label">Moves</span><span id="blockwood-moves">0</span></div>
      <div><span class="label">Ziel</span><span id="blockwood-target">40</span></div>
    </div>
    <div class="game-panel__actions">
      <button class="btn btn-primary" id="blockwood-move">Zug ausführen</button>
      <button class="btn btn-outline" id="blockwood-reset">Reset</button>
    </div>
  </div>
</section>
