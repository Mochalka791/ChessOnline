<section class="mines-panel">
  <div class="mines-panel__board" id="mines-board"></div>
  <div class="mines-panel__controls">
    <h2>Minesweeper</h2>
    <p class="game-panel__status" id="mines-status">Deck ein Feld auf.</p>
    <div class="mines-form">
      <label>Zeile
        <input type="number" id="mines-row" min="1" max="5" value="1" />
      </label>
      <label>Spalte
        <input type="number" id="mines-column" min="1" max="5" value="1" />
      </label>
    </div>
    <div class="game-panel__actions">
      <button class="btn btn-primary" id="mines-reveal">Aufdecken</button>
      <button class="btn btn-outline" id="mines-reset">Reset</button>
    </div>
  </div>
</section>
