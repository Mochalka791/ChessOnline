<section class="game-panel">
  <div class="game-panel__header">
    <h2>Snake</h2>
    <p class="game-panel__status" id="snake-status">Bereit.</p>
  </div>
  <div class="game-panel__body">
    <div class="game-panel__metrics">
      <div><span class="label">Score</span><span id="snake-score">0</span></div>
      <div><span class="label">Alive</span><span id="snake-alive">Ja</span></div>
    </div>
    <div class="game-panel__actions">
      <button class="btn btn-primary" data-direction="Up">Oben</button>
      <button class="btn btn-outline" data-direction="Down">Unten</button>
      <button class="btn btn-outline" data-direction="Left">Links</button>
      <button class="btn btn-outline" data-direction="Right">Rechts</button>
      <button class="btn btn-outline" id="snake-reset">Reset</button>
    </div>
  </div>
</section>
