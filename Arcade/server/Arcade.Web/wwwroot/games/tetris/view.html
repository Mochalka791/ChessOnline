<section class="game-panel">
  <div class="game-panel__header">
    <h2>Tetris</h2>
    <p class="game-panel__status" id="tetris-status">Noch kein Spiel gestartet.</p>
  </div>
  <div class="game-panel__body">
    <div class="game-panel__metrics">
      <div><span class="label">Level</span><span id="tetris-level">1</span></div>
      <div><span class="label">Score</span><span id="tetris-score">0</span></div>
      <div><span class="label">Lines</span><span id="tetris-lines">0</span></div>
    </div>
    <div class="game-panel__actions">
      <button class="btn btn-primary" id="tetris-tick">Tick</button>
      <button class="btn btn-outline" data-action="left">Links</button>
      <button class="btn btn-outline" data-action="right">Rechts</button>
      <button class="btn btn-outline" data-action="rotate">Rotate</button>
      <button class="btn btn-outline" id="tetris-reset">Reset</button>
    </div>
  </div>
</section>
