<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div class="arcade-shell">
      <header class="arcade-topbar" role="banner">
        <div class="arcade-topbar__brand">Arcade</div>
        <nav class="arcade-nav" aria-label="Hauptnavigation">
          <a class="arcade-nav__link" href="#/">Home</a>
          <a class="arcade-nav__link" href="#/games">Games</a>
          <a class="arcade-nav__link" href="#/about">About</a>
          <a class="arcade-nav__link" href="#/more">More</a>
        </nav>
      </header>
      <main id="app" class="arcade-content" role="main"></main>
    </div>
    <div class="toast-container" id="toast-container" aria-live="assertive"></div>
    <div id="debug-panel" class="debug-panel" hidden>
      <div class="debug-panel__title">Debug</div>
      <div class="debug-panel__actions"></div>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
