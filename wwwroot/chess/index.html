<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess.KO • Online spielen</title>
    <link rel="stylesheet" href="../menu/menu.css" />
    <link rel="stylesheet" href="chess.css" />
    <script src="https://unpkg.com/@microsoft/signalr@latest/dist/browser/signalr.min.js" defer></script>
    <script src="/chess/chess.js" defer></script>
</head>
<body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <div class="chess-app">
        <header class="chess-topbar">
            <a class="brand" href="/">CHESS.KO</a>
            <div id="status-banner" class="status-pill status-ready" role="status">Bereit</div>
        </header>

        <main class="chess-grid" aria-label="Schachoberfläche">
            <aside class="panel menu-panel">
                <h2 class="panel-title">Menü</h2>
                <form class="menu-form" autocomplete="off">
                    <label class="field">
                        <span>Raum</span>
                        <input id="room" type="text" value="testroom" />
                    </label>
                    <label class="field">
                        <span>Name</span>
                        <input id="name" type="text" value="Spieler" />
                    </label>
                    <label class="field">
                        <span>Seite</span>
                        <select id="side">
                            <option value="auto">Automatisch</option>
                            <option value="white">Weiß</option>
                            <option value="black">Schwarz</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Bot-ELO <strong id="elo-value">1000</strong></span>
                        <input id="elo" type="range" min="400" max="3200" step="50" value="1000" />
                    </label>
                </form>

                <div class="menu-actions">
                    <button id="join" type="button" class="btn solid full">Online beitreten</button>
                    <button id="join-bot" type="button" class="btn ghost full">Gegen Bot</button>
                </div>

                <div class="menu-analysis">
                    <label class="field">
                        <span>Tiefe <strong id="depth-value">14</strong></span>
                        <input id="depth" type="range" min="4" max="30" step="2" value="14" />
                    </label>
                    <div class="analysis-buttons">
                        <button id="local-analysis" type="button" class="btn solid full">Stockfish Analyse</button>
                        <button id="theme-toggle" type="button" class="btn ghost full">Dunkles Theme</button>
                    </div>
                </div>

                <section class="status-box">
                    <h3>Status</h3>
                    <div id="status-log" class="status-log">
                        <p>Wähle einen Modus, um loszulegen.</p>
                    </div>
                </section>
            </aside>

            <section class="board-column">
                <article class="panel player-strip">
                    <div class="player-card">
                        <div class="avatar" aria-hidden="true">👤</div>
                        <div class="player-meta">
                            <div id="players">Weiß: — • Schwarz: —</div>
                            <div id="turn" class="turn-pill" data-side="white">Am Zug: –</div>
                        </div>
                        <div id="board-badge" class="board-badge" hidden></div>
                    </div>
                    <div class="clocks" id="clocks" aria-live="polite">
                        <div class="clock clock-white">
                            <span class="label">Weiß</span>
                            <span class="time" data-side="white">00:00</span>
                            <span class="increment">+2s</span>
                        </div>
                        <div class="clock clock-black">
                            <span class="label">Schwarz</span>
                            <span class="time" data-side="black">00:00</span>
                            <span class="increment">+2s</span>
                        </div>
                    </div>
                </article>

                <div class="panel board-panel">
                    <div class="board-shell">
                        <div id="board" class="board" role="grid" aria-label="Schachbrett"></div>
                        <div id="move-hints" class="move-hints" aria-hidden="true"></div>
                    </div>
                </div>

                <footer class="panel action-strip">
                    <div class="action-grid">
                        <button id="request-undo" type="button" class="icon-btn">
                            <span class="icon">↩️</span>
                            <span class="label">Rückgängig</span>
                        </button>
                        <button id="offer-draw" type="button" class="icon-btn">
                            <span class="icon">🤝</span>
                            <span class="label">Remis</span>
                        </button>
                        <button id="resign" type="button" class="icon-btn">
                            <span class="icon">⚡</span>
                            <span class="label">Aufgeben</span>
                        </button>
                        <button id="copy-pgn" type="button" class="icon-btn">
                            <span class="icon">📄</span>
                            <span class="label">PGN</span>
                        </button>
                        <button id="copy-fen" type="button" class="icon-btn">
                            <span class="icon">♟</span>
                            <span class="label">FEN</span>
                        </button>
                    </div>
                </footer>
            </section>

            <aside class="panel info-panel">
                <section class="info-card">
                    <div class="info-head">
                        <h2>Züge</h2>
                        <span id="moves-placeholder" class="muted">Noch keine Züge.</span>
                    </div>
                    <ol id="moves" class="moves" aria-live="polite"></ol>
                </section>

                <section class="info-card analysis">
                    <div class="info-head">
                        <h2>Analyse</h2>
                    </div>
                    <div id="analysis" class="analysis-stream" aria-live="polite">
                        <div class="analysis-placeholder">Starte Stockfish, um Feedback zu erhalten.</div>
                    </div>
                </section>
            </aside>
        </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="loading-overlay" class="loading-overlay" hidden>
        <div class="loading-dialog" role="alert" aria-live="assertive">
            <div class="spinner"></div>
            <span>Bitte warten …</span>
        </div>
    </div>

    <template id="cell-tpl">
        <div class="cell" role="gridcell" tabindex="-1">
            <img class="piece" alt="" draggable="false" />
            <div class="dot" aria-hidden="true"></div>
        </div>
    </template>
</body>
</html>
