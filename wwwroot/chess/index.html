<body>
    <header class="chess-topbar">
        <div class="chess-brand">CHESS.KO</div>
        <div class="chess-badge"> </div>
        <div></div>
    </header>

    <main class="chess-wrap">
        <!-- Links -->
        <section class="left">
            <div class="panel">
                <div class="panel thin menu">Menu</div>
            </div>
        </section>

        <!-- Mitte -->
        <section class="center">
            <div class="panel thin player">
                <div class="avatar">👤</div>
                <div>
                    <div class="name">Nickname</div>
                    <div class="bar"></div>
                    <div class="meta">ELo (0000) &nbsp;&nbsp; lvl. 30</div>
                </div>
                <div></div>
            </div>

            <div class="panel board-shell">
                <div id="board"><!-- Canvas/SVG deines Boards --></div>
            </div>

            <div class="bottom">
                <button class="square-btn" aria-label="??"></button>
                <div class="timer-line"></div>
            </div>
        </section>

        <!-- Rechts -->
        <section class="right">
            <div class="panel thin head"></div>
            <div class="panel moves">
                <ol>
                    <li>e4 c5</li>
                    <li>d3 Nc6</li>
                    <li>d4 Rb8</li>
                </ol>
            </div>
            <div class="panel footer">
                <div>
                    <div class="action">↩️</div>
                    <div class="label">Rückgängig</div>
                </div>
                <div>
                    <div class="action">⚡</div>
                    <div class="label">Aufgeben</div>
                </div>
                <div>
                    <div class="action">💬</div>
                    <div class="label">Hinweis</div>
                </div>
                <div>
                    <div class="action">★</div>
                    <div class="label">Optionen</div>
                </div>
            </div>
        </section>
    </main>
</body>
