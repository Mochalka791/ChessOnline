<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade – Menü</title>
    <link rel="stylesheet" href="/menu/menu.css" />
</head>
<body>
    <noscript><div class="noscript-warning">Bitte JavaScript aktivieren.</div></noscript>

    <main class="lobby" aria-labelledby="lobby-title">
        <header class="lobby-hero">
            <div>
                <p class="eyebrow">Arcade</p>
                <h1 id="lobby-title">Wähle dein Spiel</h1>
                <p class="subline">Spiele Schach gegen Freunde oder den Bot. Snake und Tetris folgen.</p>
            </div>
            <a class="cta primary" href="/chess/index.html">Jetzt Schach spielen</a>
        </header>

        <section class="game-grid" role="list">
            <article class="game-card" role="listitem" aria-labelledby="card-chess">
                <header style="display:flex;align-items:center;gap:.6rem;">
                    <h2 id="card-chess" style="margin:0;">Schach</h2>
                    <span class="badge live">Verfügbar</span>
                </header>
                <p>Analysiere Partien, spiele online oder fordere den Stockfish-Bot heraus.</p>
                <a class="cta secondary" href="/chess/index.html">Öffnen</a>
            </article>

            <article class="game-card disabled" role="listitem" aria-disabled="true">
                <header style="display:flex;align-items:center;gap:.6rem;">
                    <h2 style="margin:0;">Snake</h2>
                    <span class="badge soon">Bald</span>
                </header>
                <p>Update folgt.</p>
                <button class="cta secondary" type="button" disabled>Nicht verfügbar</button>
            </article>

            <article class="game-card disabled" role="listitem" aria-disabled="true">
                <header style="display:flex;align-items:center;gap:.6rem;">
                    <h2 style="margin:0;">Tetris</h2>
                    <span class="badge soon">Bald</span>
                </header>
                <p>Update folgt.</p>
                <button class="cta secondary" type="button" disabled>Nicht verfügbar</button>
            </article>
        </section>
    </main>
</body>
</html>
