<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Online</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
</head>
<body>
    <div class="topbar">
        <input id="room" placeholder="room-id" value="testroom" />
        <input id="name" placeholder="your name" value="Player" />
        <select id="side">
            <option value="auto">Auto</option>
            <option value="white">White</option>
            <option value="black">Black</option>
        </select>
        <label class="topbar-field">
            Bot ELO
            <input id="elo" type="number" min="50" max="3000" step="50" value="1000">
        </label>
        <button id="join">Join</button>
        <button id="join-bot">Play vs Bot</button>
        <button id="save-pgn">Download PGN</button>
        <span id="turn" class="turn-pill">Am Zug: -</span>
    </div>

    <div class="layout">
        <div class="left">
            <div id="players"></div>
            <div id="clocks"></div>
            <div id="board" class="board"></div>
        </div>
        <div class="right">
            <section class="panel">
                <div class="panel-header">
                    <h3>Moves</h3>
                </div>
                <ol id="moves" class="moves"></ol>
            </section>
            <section class="panel analysis-panel">
                <div class="panel-header">
                    <h3>Analysis</h3>
                    <div class="analysis-controls">
                        <label class="topbar-field">
                            Depth
                            <input id="depth" type="number" min="4" max="30" step="2" value="14">
                        </label>
                        <button id="local-analysis" class="ghost-button">Stockfish Eval</button>
                    </div>
                </div>
                <div id="analysis" class="analysis-stream" aria-live="polite">
                    <div class="analysis-placeholder">Starte Stockfish, um die Stellung schnell bewerten zu lassen.</div>
                    <div class="analysis-placeholder">Run Stockfish to get a quick evaluation of the current position.</div>
                </div>
            </section>
        </div>
    </div>

    <!-- GameOver overlay -->
    <div id="over" class="overlay" role="dialog" aria-modal="true" aria-labelledby="over-title">
        <div class="overlay-dialog">
            <h2 id="over-title">Game Over</h2>
            <div id="over-body"></div>
            <div class="overlay-actions">
                <button id="over-ai" class="ghost-button">AI analysis</button>
                <button id="over-rematch">Play again</button>
                <button id="over-close" class="ghost-button">Close</button>
            </div>
        </div>
    </div>

    <template id="cell-tpl">
        <div class="cell">
            <img class="piece" alt="" />
        </div>
    </template>

    <script src="/app.js"></script>
</body>
</html>
