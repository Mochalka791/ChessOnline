<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anmelden</title>
    <link rel="stylesheet" href="/css/menu.css" />
    <style>
        main {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .box {
            width: min(560px, 92%);
            background: var(--panel);
            border: 1px solid color-mix(in oklab, var(--panel) 70%, white 6%);
            border-radius: var(--radius);
            padding: 28px;
        }

            .box h1 {
                margin: 0 0 8px
            }

            .box p {
                margin: 0;
                color: var(--muted)
            }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">ARCADE</div>
        <nav class="actions"><a class="btn ghost" href="/">Zurück</a></nav>
    </header>
    <main><section class="box"><h1>Anmelden</h1><p>Leere Seite (kommt später).</p></section></main>
</body>
</html>
